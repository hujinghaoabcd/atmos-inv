[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "atmos-inv"
version = "0.1.0"
description = "Research infrastructure for satellite-constrained 3D neural atmospheric inversion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "hydra-core>=1.3,<2",
  "omegaconf>=2.3,<3",
  "numpy>=1.26,<3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
data = [
  "pandas>=2.1",
  "xarray>=2024.1",
  "dask[array]>=2024.1",
  "zarr>=2.17",
  "netCDF4>=1.6",
  "h5netcdf>=1.3",
]
geo = [
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
]
ml = [
  "torch>=2.3",
  "torch-geometric>=2.5",
  "scikit-learn>=1.4",
]
workflow = [
  "snakemake>=8,<10",
]
tracking = [
  "mlflow>=2.12",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
]
full = [
  "atmos-inv[data,geo,ml,workflow,tracking,dev]",
]

[project.scripts]
atmos-inv = "atmos_inv.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atmos_inv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
